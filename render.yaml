services:
  # Backend FastAPI Service
  - type: web
    name: shipment-backend
    runtime: python
    repo: masintimatesimports/app  # ← FIXED: Just username/repo
    region: singapore
    plan: free
    buildCommand: |
      pip install -r shipment_backend/requirements.txt
    startCommand: |
      cd shipment_backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health

  # Frontend Static Site
  - type: static
    name: shipment-frontend
    repo: masintimatesimports/app  # ← FIXED: Just username/repo
    region: singapore
    plan: free
    buildCommand: |
      echo "Building frontend..."
    publishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html