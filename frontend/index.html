<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipment Portal</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fas fa-ship"></i>
                <h2>ShipTrack</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="#dashboard" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="#upload"><i class="fas fa-file-upload"></i> Upload Excel</a></li>
                <li><a href="#tracking"><i class="fas fa-search"></i> Track Shipments</a></li>
                <li><a href="#fields"><i class="fas fa-cog"></i> Custom Fields</a></li>
                <li><a href="#mapping"><i class="fas fa-columns"></i> Column Mapping</a></li>
                <li><a href="#agents"><i class="fas fa-users-cog"></i> Agent Management</a></li>
            </ul>
            <div class="agent-info">

            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div style="display: flex; align-items: center; gap: 20px;">
                    <h1 id="page-title">Dashboard</h1>
                    <div id="role-indicator" style="font-size: 0.9em; color: #64748b;">
                        <!-- Role will be added by JavaScript -->
                    </div>
                </div>
                <div class="user-info">
                    <span id="welcome-text">Welcome</span>
                    <button id="logout-btn" class="btn-secondary" style="margin-left: 15px; padding: 8px 15px;">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </header>

            <div class="content-area" id="content-area">
                <!-- Content will load here -->
                <p>Loading...</p>
            </div>
        </main>
    </div>

    <!-- Inside your index.html, update the scripts section -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@latest/dist/xlsx.full.min.js"></script>

    <!-- Load OUR scripts in correct order -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/agents.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/upload.js"></script>
    <script src="assets/js/tracking.js"></script>
    <script src="assets/js/fields.js"></script>
    <script src="assets/js/mapping.js"></script>
    
</body>
</html>
